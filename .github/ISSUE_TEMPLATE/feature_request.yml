name: Feature request
description: Suggest a game, improvement or new language
title: "[Idea]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why is it useful?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Gameplay
        - Animations / art
        - WiFi multiplayer
        - Accessibility
        - Languages
        - Website
        - Other
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not involve real-money gambling, payments or cash prizes.
          required: true
        - label: I have not copied trademarked art or assets.
          required: true
